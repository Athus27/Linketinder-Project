plugins {
    id 'groovy'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.groovy.all
    implementation 'org.postgresql:postgresql:42.6.0'
    testImplementation libs.spock.core
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'net.bytebuddy:byte-buddy:1.18.3'
    testRuntimeOnly 'org.objenesis:objenesis:3.6'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'org.linketinder.ApiApp'
}

tasks.named('test') {
    useJUnitPlatform()
}

run {
    standardInput = System.in
}

testing {
    suites {
        integrationTest(JvmTestSuite) {
            useSpock('2.4-groovy-4.0')

            dependencies {
                implementation project()
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

tasks.withType(Test).configureEach { Test testTask ->
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            println """
${testTask.name}:
- Executados: ${result.testCount}
- Passaram: ${result.successfulTestCount}
- Falharam: ${result.failedTestCount}
- Ignorados: ${result.skippedTestCount}
"""
        }
    }
}
